<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake AI chat (fixture)</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  nav { width: 200px; background: #f3f3f3; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  nav input { margin-bottom: 8px; }
  main { flex: 1; display: flex; flex-direction: column; }
  #msgs { flex: 1; overflow: auto; padding: 12px; }
  .user { background: #eef; margin: 6px 0; padding: 6px; white-space: pre-wrap; }
  .assistant { background: #efe; margin: 6px 0; padding: 6px; }
  #composer { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-top: 1px solid #ddd; }
  #filesbar { width: 100%; font-size: 12px; color: #555; }
  #editor, #ta { flex: 1; min-height: 40px; border: 1px solid #ccc; padding: 6px; }
  pre { background: #222; color: #eee; padding: 6px; }
  .hdr { font-size: 11px; color: #aaa; }
</style>
</head>
<body>
<nav aria-label="История">
  <input type="search" placeholder="Search chats">
  <a href="/c/aaaa1111-2222-3333">Планы на неделю</a>
  <a href="/c/bbbb4444-5555-6666">Скрипт для бэкапа</a>
  <a href="/project/proj-777-alpha">Проект «Работа»</a>
  <a href="/settings">Настройки</a>
</nav>
<main>
  <div id="msgs">
    <div class="user">Привет</div>
    <div class="assistant" data-role="assistant"><p>Здравствуйте! Чем помочь?</p></div>
  </div>
  <form id="composer"></form>
</main>
<script>
  // Simulates a modern chat site.
  //  ?mode=textarea → plain textarea + Enter to send, no send button, no data attributes.
  //  ?mode=paste    → no file input; files are accepted only by pasting into the editor.
  var mode = new URLSearchParams(location.search).get('mode') || 'rich';
  var composer = document.getElementById('composer');
  var input, sendBtn, stopBtn;
  var uploading = false;
  window.__sent = [];
  window.__files = [];
  window.__downloads = [];

  function addFiles(list) {
    Array.prototype.forEach.call(list, function (f) { window.__files.push(f.name + ':' + f.size + ':' + f.type); });
    document.getElementById('filesbar').textContent = window.__files.map(function (x) { return x.split(':')[0]; }).join(', ');
    // Pretend to upload: the send button stays disabled for a moment.
    uploading = true;
    if (sendBtn) sendBtn.disabled = true;
    setTimeout(function () { uploading = false; if (sendBtn) sendBtn.disabled = !input.innerText.trim(); }, 1200);
  }

  if (mode === 'textarea') {
    composer.innerHTML = '<textarea id="ta" placeholder="Спросите что-нибудь"></textarea>';
    input = document.getElementById('ta');
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitPrompt(input.value); input.value = ''; }
    });
    document.querySelectorAll('.assistant').forEach(function (a) { a.removeAttribute('data-role'); });
  } else {
    composer.innerHTML = '<div id="filesbar"></div>' +
      (mode === 'paste' ? '' : '<input type="file" id="fileIn" multiple accept="image/*,.pdf,.txt,.csv,application/pdf" hidden>') +
      '<div id="editor" class="ProseMirror" contenteditable="true" data-placeholder="Message"></div>' +
      '<button type="button" aria-label="Attach files">📎</button>' +
      '<button type="button" aria-label="Voice mode">🎤</button>' +
      '<button type="submit" data-testid="send-button" aria-label="Send prompt" disabled>↑</button>';
    input = document.getElementById('editor');
    sendBtn = composer.querySelector('[data-testid="send-button"]');
    var fileIn = document.getElementById('fileIn');
    if (fileIn) fileIn.addEventListener('change', function () { addFiles(fileIn.files); });
    if (mode === 'paste') {
      input.addEventListener('paste', function (e) {
        if (e.clipboardData && e.clipboardData.files.length) { e.preventDefault(); addFiles(e.clipboardData.files); }
      });
    }
    input.addEventListener('input', function () { sendBtn.disabled = uploading || !input.innerText.trim(); });
    composer.addEventListener('submit', function (e) {
      e.preventDefault();
      if (uploading) return;
      var t = input.innerText;
      input.innerHTML = '';
      sendBtn.disabled = true;
      submitPrompt(t);
    });
  }

  function submitPrompt(text) {
    if (!text.trim()) return;
    window.__sent.push(text);
    var msgs = document.getElementById('msgs');
    var u = document.createElement('div');
    u.className = 'user';
    u.textContent = text;
    msgs.appendChild(u);
    var a = document.createElement('div');
    a.className = 'assistant';
    if (mode !== 'textarea') a.setAttribute('data-role', 'assistant');
    msgs.appendChild(a);
    if (sendBtn) {
      stopBtn = document.createElement('button');
      stopBtn.type = 'button';
      stopBtn.setAttribute('aria-label', 'Stop streaming');
      stopBtn.textContent = '■';
      composer.appendChild(stopBtn);
    }
    var wantsTool = /папк/i.test(text);
    var wantsFile = /файл/i.test(text);
    var reply = wantsTool ? 'Сейчас создам папку на вашем устройстве.' : wantsFile ? 'Готово, вот файл с таблицей.' : 'Готово, задача выполнена без инструментов.';
    var words = reply.split(' ');
    var p = document.createElement('p');
    a.appendChild(p);
    var i = 0;
    var timer = setInterval(function () {
      if (i < words.length) { p.textContent += (i ? ' ' : '') + words[i++]; return; }
      clearInterval(timer);
      if (wantsTool) {
        var pre = document.createElement('pre');
        pre.innerHTML = '<div class="hdr">relay <button type="button">Copy code</button></div><code></code>';
        pre.querySelector('code').textContent = '{"tool": "mkdir", "args": {"path": "~/Download/привет"}}';
        a.appendChild(pre);
      }
      if (wantsFile) {
        var link = document.createElement('a');
        link.href = '/files/report.csv';
        link.setAttribute('download', 'report.csv');
        link.textContent = 'report.csv';
        link.addEventListener('click', function (e) { e.preventDefault(); window.__downloads.push(link.getAttribute('download')); });
        a.appendChild(link);
      }
      if (stopBtn) { stopBtn.remove(); stopBtn = null; }
    }, 120);
  }
</script>
</body>
</html>
